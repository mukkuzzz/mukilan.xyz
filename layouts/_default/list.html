{{ define "title" }}{{ .Title | title }}{{ end }}
{{ define "main" }}
{{ .Content }}
<ul class="entries">
  {{ range .Pages }}
  <li class="entry">
    <a class="entry-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="entry-date">{{ .Date.Format "2006-01-02" }}</span>
    {{ if .Params.summary }}<p class="entry-summary">{{ .Params.summary }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
